# Read by [PrereqsFile] in dist.ini, for prerequisites [AutoPrereqs] cannot find
# in the code.  The perl floor is here as well as on the use line of every file,
# so the metadata states it even where one file leaves that line out.
runtime:
  requires:
    perl: '5.040'

    # The releases that tCMS needs.  [AutoPrereqs] finds both modules, but not
    # their versions.
    Trog::TOTP: '1.008'
    Trog::SQLite: '0.004'

    # Loaded by bin/, which [AutoPrereqs] does not read, because nothing
    # installs bin/ as programs.  Imager loads its ICO and PNG formats by name.
    File::Temp: 0
    File::Which: 0
    IO::Prompter: 0
    Imager: 0
    Imager::File::ICO: 0
    Imager::File::PNG: 0

    # Loaded by name, or by something that tCMS hands them to: the DBI driver
    # of the databases, and the server that runs the application.
    DBI: 0
    DBD::SQLite: 0
    Starman: 0

    # The backend that Minion loads by name for the job queue, in data/jobs.db.
    Minion: 0
    Minion::Backend::SQLite: 0
    Mojolicious: 0

    # Listed in Makefile.PL, and loaded by nothing in lib/, bin/ or t/ today.
    # They are kept so that this change installs what Makefile.PL installed.
    Carp::Always: 0
    CryptX: 0
    Date::Format: 0
    DateTime::Format::HTTP: 0
    Errno: 0
    HTTP::Body: 0
    HTTP::Tiny::UNIX: 0
    Linux::Perl::inotify: 0
    Net::IP: 0
    URL::Encode: 0

test:
  # Suggested rather than recommended, because dzil listdeps reports what is
  # recommended, and the browser test skips without it.
  suggests:
    Playwright: 0
