[general]
    # FlatFile or SQLite.  See the Readme, and bin/migrate.pl
    # for moving an existing FlatFile site across.
    data_model=SQLite
    # What the site calls itself in page titles and feeds.
    title=tCMS
    # Which directory under www/themes to render with.
    # Empty means the stock look.
    theme=
    # The name this site answers to.  Used wherever an absolute URL has to be
    # built, and by the virtual machine data sources to tell which guest is
    # this one.
    hostname=
[provisioner]
    # Where the two repositories which own the VM provisioning lifecycle are
    # checked out.  Only needed by Trog::DataSource::ProvisionedVirt, which
    # degrades to a plain guest listing without them.
    # Example: /home/you/Code/provisioners
    provisioners=
    # Example: /home/you/Code/trog-provisioner
    trog_provisioner=
[security]
    # Space separated list of hosts embeds (iframes, remote media) may come
    # from.  Wildcards are allowed, e.g. *.vimeo.com.  Anything not listed here
    # is refused by the Content-Security-Policy.
    allow_embeds_from=vimeo.com *.vimeo.com youtube.com *.youtube.com www.youtube-nocookie.com
