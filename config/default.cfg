[general]
    # FlatFile or SQLite.  See the Readme, and bin/migrate.pl
    # for moving an existing FlatFile site across.
    data_model=FlatFile
    title=tCMS
[provisioner]
    # Where the two repositories which own the VM provisioning lifecycle are
    # checked out.  Only needed by Trog::DataSource::ProvisionedVirt, which
    # degrades to a plain guest listing without them.
    # provisioners=/home/you/Code/provisioners
    # trog_provisioner=/home/you/Code/trog-provisioner
[security]
    allow_embeds_from=vimeo.com *.vimeo.com youtube.com *.youtube.com www.youtube-nocookie.com
[nginx-unit]
    socket=/var/run/control.unit.sock
