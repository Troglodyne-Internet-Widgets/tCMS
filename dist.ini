name = tCMS
author = George S. Baugh <george@troglodyne.net>
license = GPL_3
copyright_holder = Troglodyne LLC
copyright_year = 2020
main_module = lib/TCMS.pm

; The version is the last release tag plus one, so no line here says it.  The
; default pattern wants a v before the version, which [Git::Tag] below does not
; write.  V=1.000 dzil release picks a version by hand.
[Git::NextVersion]
first_version  = 0.01
version_regexp = ^v?(\d+\.\d+)$

; Simpler than doing include_dotfiles, and due to other dzil brain damage
[Run::BeforeBuild]
run = rm -rf .build/*
[Run::Test]
run = cp $(git rev-parse --show-toplevel)/.perltidyrc            .perltidyrc
run = cp $(git rev-parse --show-toplevel)/.perlcriticrc          .perlcriticrc
run = cp $(git rev-parse --show-toplevel)/.preferred_modules.ini .preferred_modules.ini
run = cp $(git rev-parse --show-toplevel)/.pod_stopwords         .pod_stopwords
run = mkdir -p data/files www/themes www/assets/private www/statics totp logs
run = echo .perltidyrc >> MANIFEST
run = echo .perlcriticrc >> MANIFEST
run = echo .preferred_modules.ini >> MANIFEST
run = echo .pod_stopwords >> MANIFEST
; Gathers what git does not ignore, so .gitignore keeps a file out of the build
; as well as out of the repository.  Untracked files come too, so a build
; before the commit has the new files, and [Git::Check] refuses a release while
; any are untracked.  [License] writes LICENSE, and a second copy from the tree
; stops the build.  MANIFEST.SKIP, which [ManifestSkip] reads, says which
; tracked files stay out.
[Git::GatherDir]
include_untracked = 1
exclude_filename = LICENSE
[MetaYAML]
[MetaJSON]
[License]
[Readme]
[InstallGuide]
[ExtraTests]
[ExecDir]
[ShareDir]
[MakeMaker]
[Manifest]
[PruneFiles]
[PruneCruft]
[ManifestSkip]
; [ReadmeAnyFromPod] below writes README.md into the repository at each build,
; and the version in it changes at each release.
[Git::Check]
    allow_dirty = README.md
; Changes gets the Changelog trailers of the commits since the last release
; tag.  It must be above [Git::Commit], which commits what it writes.  The
; format names the PAUSE id, because %P asks the uploader for it at each build.
[Git::ChangelogFromTrailers]
    format = %v %{yyyy-MM-dd}d TEODESIAN
    version_regexp = ^v?(\d+\.\d+)$
[Git::Commit / Release_Commit]
    allow_dirty = Changes
    allow_dirty = README.md
    add_files_in = /
    commit_msg = %v%n%n%c
[Git::Tag]
    tag_format = %v
    tag_message = %v
[Git::Push]
[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
[MetaMergeFile]
; Reads prereqs.yml or prereqs.json and no other name: its filename option
; takes a list, and a single value from dist.ini arrives as a string it refuses.
[PrereqsFile]
[MetaNoIndex]
    directory = t
    directory = templates
    directory = docs
[MetaProvides::Package]
    inherit_version = 0

[AutoPrereqs]
skip = ^Playwright$
skip = ^TPSGI::
; package NAME VERSION rather than a $VERSION line, which PkgVersion would put
; above use strict, where RequireUseStrict in the compat profile reports it.
; Needs 5.012, and neither profile allows a floor below 5.014.
[PkgVersion]
use_package = 1

[PodWeaver]
[Git::Contributors]

[@TestingMania]
critic_config = .perlcriticrc
changelog = Changes
disable = Test::Portability
disable = PodCoverageTests

; In place of [PodCoverageTests]: it also checks that the POD of each sub says
; what the sub takes, returns, and how it fails.
[Test::Pod::Coverage::More]

[CheckMetaResources]
[CheckPrereqsIndexed]
[CheckChangesHasContent]

; The account and the repository come from the URL of the origin remote.  Do
; not set user here: it overrides that URL, and the metadata then names the old
; place after the repository moves to another account.
[GithubMeta]
issues = 1

; README.md is generated from the main module's POD.  Do not write one by hand:
; you will end up with two, they will disagree, and on a case-insensitive
; checkout only one of them exists at all.
[ReadmeAnyFromPod]
type = gfm
filename = README.md
location = root

; `dzil authordeps` doesn't know about the Pod Weaver dependencies:
; authordep Pod::Weaver::Section::Contributors = 0
; authordep Pod::Weaver::Plugin::Encoding = 0
; authordep Pod::Weaver::Section::SeeAlso = 0
; authordep Pod::Weaver::Section::GenerateSection = 0
; authordep Pod::Elemental::Transformer::List = 0
; [Blurbs] and [Test::Pod::Coverage::More] come from one distribution, and one
; checks the POD that the other writes, so they take one release.  0.004 reads
; a call such as Class->name() in a heading, and knows an abstract method.
; authordep Pod::Weaver::Section::Blurbs = 0.004
; authordep Dist::Zilla::Plugin::Test::Pod::Coverage::More = 0.004

; Nor about what the hooks in git-hooks/ run: tests-covering chooses the tests
; that a commit can break.
; authordep Perl::Tests::Covering = 0.002

; Nor about the commands that CLAUDE.md tells an agent to run: dzil podchecker
; checks the POD as Pod::Weaver writes it.
; authordep Dist::Zilla::App::Command::podchecker = 0.001

; Nor about what the release tests that [@TestingMania] writes load: its
; plugins declare those modules as develop prereqs, which `dzil authordeps`
; does not list, and `dzil test --release` cannot load the tests without them.
; authordep Test::Kwalitee = 0
; authordep Test::Vars = 0

